<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NC Driving Test Practice Engine</title>
    <link rel="icon" href="data:,">
    <style>
        /* --- Color Variables & Themes --- */
        :root {
          --bg-color: #f4f6f8;
          --card-bg: #ffffff;
          --hud-bg: #eef2f7;
          --hud-border: #cbd5e1;
          --text-main: #1f2937;
          --text-muted: #6b7280;
          --border-color: #e5e7eb;
          --option-hover: #f1f5f9;
          --footer-bg: rgba(244, 246, 248, 0.95);
          
          /* Accent colors for text contrast */
          --label-gen: #0284c7;
          --label-sign: #7e22ce;
          --toggle-btn-bg: #ffffff;
          --toggle-btn-border: #cbd5e1;
        }

        [data-theme="dark"] {
          --bg-color: #0f172a;
          --card-bg: #1e293b;
          --hud-bg: #1e293b;
          --hud-border: #334155;
          --text-main: #f8fafc;
          --text-muted: #94a3b8;
          --border-color: #334155;
          --option-hover: #334155;
          --footer-bg: rgba(15, 23, 42, 0.95);
          
          /* High-contrast dark mode accents */
          --label-gen: #38bdf8;
          --label-sign: #c084fc;
          --toggle-btn-bg: #0f172a;
          --toggle-btn-border: #475569;
        }

        /* --- Global Layout & Base Elements --- */
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            max-width: 650px; 
            margin: 40px auto; 
            padding: 20px; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        h2, h3 { color: var(--text-main); }

        .card { 
            background: var(--card-bg); 
            color: var(--text-main);
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); 
            margin-top: 20px; 
            position: relative; 
            border: 1px solid var(--border-color);
        }

        /* --- Dynamic HUD Top Banner --- */
        .metric-box { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            background: var(--hud-bg); 
            color: var(--text-main);
            padding: 12px 16px; 
            border-radius: 6px; 
            font-weight: bold; 
            margin-bottom: 15px; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.12); 
            border: 1px solid var(--hud-border);
        }

        .hud-label-gen { color: var(--label-gen); font-weight: 700; }
        .hud-label-sign { color: var(--label-sign); font-weight: 700; }

        /* Dark Mode Switch Button */
        .theme-toggle-btn {
            background-color: var(--toggle-btn-bg);
            border: 1px solid var(--toggle-btn-border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .theme-toggle-btn:hover {
            background-color: var(--option-hover);
        }

        /* --- Buttons & Inputs --- */
        .btn { background: #007bff; color: white; padding: 12px 18px; border: none; border-radius: 4px; cursor: pointer; margin-right: 10px; margin-top: 5px; font-weight: bold; }
        .btn:hover { background: #0056b3; }
        .btn-success { background: #28a745; }
        .btn-success:hover { background: #218838; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #bd2130; }
        .btn-purple { background: #6f42c1; }
        .btn-purple:hover { background: #59359a; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        
        .option-btn { 
            display: block; 
            width: 100%; 
            text-align: left; 
            margin: 10px 0; 
            padding: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 4px; 
            background: var(--card-bg); 
            color: var(--text-main);
            cursor: pointer; 
            transition: all 0.2s; 
            font-size: 0.95em; 
        }
        .option-btn:hover:not([disabled]) { background: var(--option-hover); }
        .option-btn.selected { background: #e0f0ff; border-color: #007bff; font-weight: bold; }
        
        .option-btn.correct-highlight { background: #d4edda !important; border-color: #c3e6cb !important; color: #155724 !important; font-weight: bold; }
        .option-btn.incorrect-highlight { background: #f8d7da !important; border-color: #f5c6cb !important; color: #721c24 !important; text-decoration: line-through; }
        .option-btn.greyed-out { opacity: 0.4; }
        
        .hidden { display: none; }
        .badge { background: #dc3545; color: white; padding: 2px 6px; border-radius: 10px; font-size: 0.8em; }
        .mastery-text { font-size: 0.85em; color: var(--text-muted); font-style: italic; margin-top: 5px; }
        .feedback-text { margin-top: 10px; font-weight: bold; font-size: 1.1em; }
        
        .status-indicator { position: absolute; top: 20px; right: 25px; font-size: 1.5em; font-weight: bold; }
        .sticky-footer { 
            position: sticky; 
            bottom: 0; 
            background: var(--footer-bg); 
            padding: 15px 0; 
            border-top: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-between; 
            z-index: 999; 
        }
        .reference-badge { display: inline-block; background: #6c757d; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <h2>NC Driving Test Practice Engine</h2>
    
    <div class="metric-box">
        <div style="font-size: 0.92em;">
            <span class="hud-label-gen">Gen Knowledge:</span> Comp: <span id="gen-completion">0%</span> | Apt: <span id="gen-aptitude">0%</span>
        </div>
        <div style="font-size: 0.92em;">
            <span class="hud-label-sign">Road Signs:</span> Comp: <span id="sign-completion">0%</span> | Apt: <span id="sign-aptitude">0%</span>
        </div>
        <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle Theme">
            <span id="themeIcon">🌙</span>
            <span id="themeLabel">Dark Mode</span>
        </button>
    </div>

    <!-- MAIN MENU DASHBOARD -->
    <div id="menu-view" class="card">
        <h3>Master Written Knowledge Exam</h3>
        <button class="btn btn-success" onclick="startFlashcardMode('GENERAL')">📖 Read General Flashcards</button>
        <button class="btn" onclick="startStudyMode('GENERAL')">🎯 Start Adaptive Study Mode</button>
        <button class="btn" onclick="startTestMode('GENERAL', 25)">📝 Take 25-Question Test</button>
        
        <h3 style="margin-top:25px;">Official Road Sign Identification</h3>
        <button class="btn btn-success" onclick="startFlashcardMode('SIGNS')">📖 Read Sign Flashcards</button>
        <button class="btn btn-purple" onclick="startStudyMode('SIGNS')">🎯 Study Road Signs</button>
        <button class="btn btn-purple" onclick="startTestMode('SIGNS', 12)">🚦 Take 12-Question Sign Test</button>
        
        <h3 style="margin-top:25px;">Mistakes & Reset</h3>
        <button class="btn btn-danger" onclick="startMistakesMode()">Review Mistakes <span id="mistake-count" class="badge">0</span></button>
        <hr style="margin-top:20px; border: 0; border-top: 1px solid var(--border-color);">
        <button class="btn btn-danger" onclick="resetProgress()">Reset Tracking Progress Data</button>
    </div>

    <!-- CONTAINER SWITCH LAYERS -->
    <div id="session-view" class="hidden">
        <h3 id="session-title">Mode</h3>
        
        <!-- CARD BASE WINDOW -->
        <div id="single-card-workspace" class="card hidden">
            <div id="question-mastery" class="mastery-text"></div>
            <div id="question-text" style="font-weight: bold; margin-top: 10px; margin-bottom: 15px;">Question text</div>
            <div id="options-container"></div>
            <div id="feedback" style="margin-top: 15px; font-weight: bold;"></div>
        </div>
        
        <!-- SCROLLABLE DECK FOR FLASHCARDS -->
        <div id="scrollable-deck-workspace" class="hidden"></div>
        
        <div class="sticky-footer">
            <button class="btn btn-secondary" onclick="returnToMenu()">Quit to Menu</button>
            <button id="next-btn" class="btn btn-success hidden" onclick="loadNextQuestion()">Next Question</button>
        </div>
    </div>

    <script>
        // --- Theme Manager ---
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeLabel = document.getElementById('themeLabel');

        const savedTheme = localStorage.getItem('nc_dmv_theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
          setTheme('dark');
        } else {
          setTheme('light');
        }

        themeToggleBtn.addEventListener('click', () => {
          const currentTheme = document.documentElement.getAttribute('data-theme');
          const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
          setTheme(newTheme);
        });

        function setTheme(theme) {
          if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeIcon.textContent = '☀️';
            themeLabel.textContent = 'Light Mode';
            localStorage.setItem('nc_dmv_theme', 'dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            themeIcon.textContent = '🌙';
            themeLabel.textContent = 'Dark Mode';
            localStorage.setItem('nc_dmv_theme', 'light');
          }
        }

        let generalPool = {};
        let signPool = {};
        let activePool = {};
        let poolPrefix = 'GENERAL';
        
        let userProgress = {}; 
        let currentSession = { mode: '', questions: [], index: 0, testScore: 0 };

        async function initApp() {
            try {
                const generalRes = await fetch('questions.json');
                generalPool = await generalRes.json();
                
                const signRes = await fetch('signs.json');
                signPool = await signRes.json();
                
                const savedProgress = localStorage.getItem('nc_driving_adaptive_progress');
                if (savedProgress) {
                    userProgress = JSON.parse(savedProgress);
                } else {
                    resetTrackingDictionary();
                }
                
                Object.keys(generalPool).forEach(id => { ensureTrackingRecord(id); });
                Object.keys(signPool).forEach(id => { ensureTrackingRecord(id); });

                activePool = generalPool;
                updateMetricsHUD();
            } catch (err) {
                console.error("Initialization failed:", err);
            }
        }

        function ensureTrackingRecord(id) {
            if (!userProgress[id]) userProgress[id] = makeProgObj();
            if (userProgress[id].level === undefined) userProgress[id].level = 0;
            if (!userProgress[id].history) userProgress[id].history = [];
        }

        function makeProgObj() {
            return { seen: false, correctCount: 0, totalAttempts: 0, isMistake: false, level: 0, history: [] };
        }

        function resetTrackingDictionary() {
            userProgress = {};
            Object.keys(generalPool).forEach(id => { userProgress[id] = makeProgObj(); });
            Object.keys(signPool).forEach(id => { userProgress[id] = makeProgObj(); });
        }

        function updateMetricsHUD() {
            const genKeys = Object.keys(generalPool);
            const signKeys = Object.keys(signPool);

            const genSeen = genKeys.filter(id => userProgress[id] && userProgress[id].seen).length;
            const genCompPct = genKeys.length > 0 ? (genSeen / genKeys.length) * 100 : 0;
            let genCorrect = 0, genAttempts = 0;
            genKeys.forEach(id => {
                if (userProgress[id]) {
                    genCorrect += userProgress[id].correctCount || 0;
                    genAttempts += userProgress[id].totalAttempts || 0;
                }
            });
            const genAptPct = genAttempts > 0 ? (genCorrect / genAttempts) * 100 : 0;

            const signSeen = signKeys.filter(id => userProgress[id] && userProgress[id].seen).length;
            const signCompPct = signKeys.length > 0 ? (signSeen / signKeys.length) * 100 : 0;
            let signCorrect = 0, signAttempts = 0;
            signKeys.forEach(id => {
                if (userProgress[id]) {
                    signCorrect += userProgress[id].correctCount || 0;
                    signAttempts += userProgress[id].totalAttempts || 0;
                }
            });
            const signAptPct = signAttempts > 0 ? (signCorrect / signAttempts) * 100 : 0;

            document.getElementById('gen-completion').innerText = genCompPct.toFixed(1) + '%';
            document.getElementById('gen-aptitude').innerText = genAptPct.toFixed(1) + '%';
            document.getElementById('sign-completion').innerText = signCompPct.toFixed(1) + '%';
            document.getElementById('sign-aptitude').innerText = signAptPct.toFixed(1) + '%';

            let mistakeBinTotal = Object.keys(userProgress).filter(id => userProgress[id] && userProgress[id].isMistake).length;
            document.getElementById('mistake-count').innerText = mistakeBinTotal;
            
            localStorage.setItem('nc_driving_adaptive_progress', JSON.stringify(userProgress));
        }

        function getNextSmartStudyQuestion() {
            const keys = Object.keys(activePool);
            let candidates = [];
            const levelWeights = { 0: 32, 1: 16, 2: 8, 3: 4, 4: 2, 5: 1 };

            keys.forEach(id => {
                const prog = userProgress[id] || makeProgObj();
                const weight = levelWeights[prog.level] || 1;
                for (let i = 0; i < weight; i++) candidates.push(id);
            });

            return candidates[Math.floor(Math.random() * candidates.length)];
        }

        function toggleView(inSession) {
            document.getElementById('menu-view').classList.toggle('hidden', inSession);
            document.getElementById('session-view').classList.toggle('hidden', !inSession);
        }

        function returnToMenu() { toggleView(false); }

        function startFlashcardMode(poolType) {
            poolPrefix = poolType;
            activePool = (poolPrefix === 'SIGNS') ? signPool : generalPool;
            currentSession = { mode: 'FLASHCARD', questions: Object.keys(activePool).sort(), index: 0 };
            
            document.getElementById('session-title').innerText = `📖 READ MODE (${poolPrefix}) — SCROLLABLE LIST DECK`;
            document.getElementById('single-card-workspace').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            
            const deckWorkspace = document.getElementById('scrollable-deck-workspace');
            deckWorkspace.innerHTML = '';
            deckWorkspace.classList.remove('hidden');
            updateMetricsHUD();

            currentSession.questions.forEach((qId, idx) => {
                const qData = activePool[qId];
                const prog = userProgress[qId] || makeProgObj();
                
                let historyHtml = '<div style="display:flex; gap:4px; margin-top:5px;">';
                for (let i = 0; i < 5; i++) {
                    if (i < prog.history.length) {
                        historyHtml += `<div style="width:14px; height:8px; background:${prog.history[prog.history.length - 1 - i] ? '#28a745' : '#dc3545'}; border-radius:1px;"></div>`;
                    } else {
                        historyHtml += `<div style="width:14px; height:8px; background:#e0e0e0; border-radius:1px;"></div>`;
                    }
                }
                historyHtml += '</div>';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="mastery-text" style="display:flex; justify-content:space-between; align-items:center; width:100%;">
                        <div>Reference ID: ${qId} (${idx + 1}/${currentSession.questions.length})</div>
                        ${historyHtml}
                    </div>
                    <div style="font-weight: bold; margin-top:10px; margin-bottom: 15px;">${qData.html}</div>
                    <div class="options-box"></div>
                `;
                
                const optsBox = card.querySelector('.options-box');
                qData.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt;
                    btn.disabled = true;
                    if (opt.trim().charAt(0) === qData.correct) btn.classList.add('correct-highlight');
                    optsBox.appendChild(btn);
                });
                deckWorkspace.appendChild(card);
            });

            toggleView(true);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function startStudyMode(poolType) {
            poolPrefix = poolType;
            activePool = (poolPrefix === 'SIGNS') ? signPool : generalPool;
            currentSession = { mode: 'STUDY', questions: [], index: 0 };
            setupSingleCardWorkspace();
            loadNextQuestion();
        }

        function startTestMode(poolType, size) {
            poolPrefix = poolType;
            activePool = (poolPrefix === 'SIGNS') ? signPool : generalPool;
            let shuffled = Object.keys(activePool).sort(() => 0.5 - Math.random());
            currentSession = { mode: 'TEST', questions: shuffled.slice(0, size), index: 0, testScore: 0 };
            setupSingleCardWorkspace();
            loadNextQuestion();
        }

        function startMistakesMode() {
            let mistakes = Object.keys(userProgress).filter(id => userProgress[id] && userProgress[id].isMistake);
            if (mistakes.length === 0) {
                alert("Your Mistakes review bucket is completely empty!");
                return;
            }
            currentSession = { mode: 'REVIEW', questions: mistakes, index: 0 };
            setupSingleCardWorkspace();
            loadNextQuestion();
        }

        function setupSingleCardWorkspace() {
            document.getElementById('scrollable-deck-workspace').classList.add('hidden');
            document.getElementById('scrollable-deck-workspace').innerHTML = '';
            document.getElementById('single-card-workspace').classList.remove('hidden');
            toggleView(true);
        }

        function loadNextQuestion() {
            document.getElementById('feedback').innerText = '';
            document.getElementById('next-btn').classList.add('hidden');
            updateMetricsHUD();

            let qId;
            if (currentSession.mode === 'STUDY') {
                qId = getNextSmartStudyQuestion();
                currentSession.index++;
                document.getElementById('session-title').innerText = `${poolPrefix} STUDY MODE — Count: ${currentSession.index}`;
            } else {
                if (currentSession.index >= currentSession.questions.length) {
                    if (currentSession.mode === 'TEST') {
                        const percentage = (currentSession.testScore / currentSession.questions.length) * 100;
                        alert(`Exam Complete!\nScore: ${currentSession.testScore}/${currentSession.questions.length} (${percentage.toFixed(1)}%)\nResult: ${percentage >= 80 ? "🎉 PASSED!" : "❌ FAILED"}`);
                    } else {
                        alert("Finished current selection block queue!");
                    }
                    returnToMenu();
                    return;
                }
                qId = currentSession.questions[currentSession.index];
                document.getElementById('session-title').innerText = `${poolPrefix} ${currentSession.mode} MODE — ${currentSession.index + 1}/${currentSession.questions.length}`;
            }

            const targetPool = (qId.startsWith('S')) ? signPool : generalPool;
            const qData = targetPool[qId];
            const prog = userProgress[qId] || makeProgObj();
            
            let historyHtml = '<div style="display:flex; gap:4px; margin-top:5px;">';
            for (let i = 0; i < 5; i++) {
                if (i < prog.history.length) {
                    historyHtml += `<div style="width:14px; height:8px; background:${prog.history[prog.history.length - 1 - i] ? '#28a745' : '#dc3545'}; border-radius:1px;"></div>`;
                } else {
                    historyHtml += `<div style="width:14px; height:8px; background:#e0e0e0; border-radius:1px;"></div>`;
                }
            }
            historyHtml += '</div>';

            document.getElementById('question-mastery').innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
                    <div>Reference ID: ${qId} | Level: ${prog.level}/5</div>
                    ${historyHtml}
                </div>`;
            document.getElementById('question-text').innerHTML = qData.html;

            const optionsDiv = document.getElementById('options-container');
            optionsDiv.innerHTML = '';

            qData.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                const optionLetter = opt.trim().charAt(0);
                btn.onclick = () => evaluateAnswer(btn, optionLetter, qData.correct, qId);
                optionsDiv.appendChild(btn);
            });
        }

        function evaluateAnswer(clickedBtn, chosenChar, correctChar, qId) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);

            userProgress[qId].seen = true;
            userProgress[qId].totalAttempts += 1;

            if (chosenChar === correctChar) {
                clickedBtn.classList.add('correct-highlight');
                document.getElementById('feedback').innerText = "✅ Correct!";
                document.getElementById('feedback').style.color = "#28a745";
                userProgress[qId].correctCount += 1;
                userProgress[qId].isMistake = false;
                userProgress[qId].history.push(1);
                if (currentSession.mode === 'TEST') currentSession.testScore += 1;
                if (userProgress[qId].level < 5) userProgress[qId].level += 1;
            } else {
                clickedBtn.classList.add('incorrect-highlight');
                document.getElementById('feedback').innerText = `❌ Incorrect. Correct answer is: ${correctChar}`;
                document.getElementById('feedback').style.color = "#dc3545";
                userProgress[qId].isMistake = true;
                userProgress[qId].history.push(0);
                userProgress[qId].level = 0;
                
                buttons.forEach(b => {
                    if (b.innerText.trim().charAt(0) === correctChar) b.classList.add('correct-highlight');
                });
            }

            if (userProgress[qId].history.length > 5) userProgress[qId].history.shift();
            currentSession.index++;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function resetProgress() {
            if (confirm("Are you sure you want to erase all your scores and clear your mastery history?")) {
                resetTrackingDictionary();
                updateMetricsHUD();
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
